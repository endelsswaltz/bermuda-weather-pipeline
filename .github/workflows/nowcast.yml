name: nowcast

on:
  schedule:
    - cron: "*/15 * * * *"   # backup only: GitHub runs these rarely for this repo; cron-job.org triggers the real 15-minute runs
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write   # keepalive: re-enable this workflow so it isn't switched off after 60 quiet days

concurrency:
  group: nowcast
  cancel-in-progress: false

jobs:
  nowcast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m nowcast.run --out site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      # Now and then GitHub can't yet see the artifact uploaded a second earlier and the deploy
      # fails with "No artifacts named github-pages"; wait and try once more before giving up.
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before retrying the deploy
        if: steps.deploy.outcome == 'failure'
        run: sleep 20
      - id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
      - name: Keep the schedule alive
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/nowcast.yml/enable"
